name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow").
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # The same two-leg matrix as the Hermod and Styx gates: windows-latest,
    # where this suite was written and has always run, and Debian 13, which is
    # what this code runs on in production. GitHub offers no Debian runner
    # image, so the Linux leg runs in a bare debian:13 container on an Ubuntu
    # runner — the same container both other gates use, so all three test the
    # same platform pair.
    #
    # Both legs matter here for a reason beyond habit: everything this library
    # does is certificates. The two platforms differ in how .NET builds and
    # validates chains, and the ISO 15118 curves — secp256r1, secp521r1 and
    # Ed448 — are exactly where that difference has bitten before.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most
    # valuable signal this matrix produces, so one leg must not cancel the
    # other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before the checkout, not after: actions/checkout falls back to
      # downloading a source tarball over the REST API when git is missing, and
      # a tarball has no submodules — which would leave this repository unable
      # to build rather than merely unable to update them. Everything else here
      # is what the .NET SDK needs on a bare container: ICU and tzdata for
      # globalization, OpenSSL for crypto, ca-certificates for NuGet over HTTPS.
      # Package names verified on Debian 13 (trixie).
      - name: Install git and .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # Two of the three submodules are pinned by their SSH URL, because that is
      # how they are pushed to. A runner has no key, so the same public
      # repositories are fetched over HTTPS instead — rewritten here rather than
      # in .gitmodules, so that a developer's own clone keeps pushing the way it
      # always has.
      - name: Fetch the submodules over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # Unlike the Hermod gate, this one *pins* what it builds against: Hermod,
      # Styx and the specification are submodules, so a breaking change in any
      # of them turns this red only when somebody moves the pointer. Which is
      # also the point of SpecificationDriftTests — moving the OPCP pointer is
      # the only signal that the specification text changed, and that test turns
      # it into a failing build naming the document that moved.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # Building the test project builds the library and both submodules with
      # it. Their warnings are theirs; ours is the project that compiles with
      # TreatWarningsAsErrors.
      - name: Build
        run: dotnet build WWCP_OPCP_Tests/WWCP_OPCP_Tests.csproj --configuration Release

      # Everything except the live smoke tests. Nothing in this run touches the
      # network: the whole ecosystem — six services, an OAuth2 token endpoint,
      # OCSP responders and a PKI — is built in-process and served over loopback
      # on ports the operating system picks, so a failure means our code broke
      # rather than that somebody else's deployment was having a day.
      #
      # The excluded category is also [Explicit] and reads its credentials from
      # the environment, so it stays out twice over.
      - name: Test (everything except the live ecosystem)
        timeout-minutes: 20
        run: dotnet test WWCP_OPCP_Tests/WWCP_OPCP_Tests.csproj --configuration Release --no-build --filter "TestCategory!=LiveHubject" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # The console log says whether the suite passed and very little else:
      # which test failed takes grepping the step log, a skip reason never
      # reaches the console at normal verbosity at all, and reading either needs
      # a signed-in browser session once the run is not the newest. TRX keeps
      # outcome, duration, error message, stack trace and the Assert.Ignore text
      # per test, and `gh run download` fetches it without a browser.
      #
      # !cancelled() rather than success(): a red run is when these files matter
      # most, and a build that fails before the test step leaves no .trx, which
      # upload-artifact reports as a warning rather than a second failure — the
      # compile error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
